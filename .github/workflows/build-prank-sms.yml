name: Build Prank SMS Simulator APK

on:
  workflow_dispatch:
  push:
    paths:
      - "PrankSmsSimulator/**"
      - ".github/workflows/build-prank-sms.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p PrankSmsSimulator :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prank-sms-simulator-apk
          path: PrankSmsSimulator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
